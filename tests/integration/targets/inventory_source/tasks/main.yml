---
- name: Generate a test ID
  set_fact:
    test_id: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
  when: test_id is not defined

- name: Generate names
  set_fact:
    openstack_cred: "AWX-Collection-tests-inventory_source-cred-openstack-{{ test_id }}"
    openstack_inv: "AWX-Collection-tests-inventory_source-inv-openstack-{{ test_id }}"
    openstack_inv_source: "AWX-Collection-tests-inventory_source-inv-source-openstack-{{ test_id }}"
    ig_name: "AWX-Collection-tests-inventory_source-ig-{{ test_id }}"

- name: Add a credential
  credential:
    description: Credentials for Openstack Test project
    name: "{{ openstack_cred }}"
    credential_type: OpenStack
    organization: Default
    inputs:
      project: Test
      username: admin
      host: https://example.org:5000
      password: passw0rd
      domain: test
  register: credential_result

- name: Add an inventory
  inventory:
    description: Test inventory
    organization: Default
    name: "{{ openstack_inv }}"

- name: Create an source inventory
  inventory_source:
    name: "{{ openstack_inv_source }}"
    description: Source for Test inventory
    inventory: "{{ openstack_inv }}"
    credential: "{{ credential_result.id }}"
    overwrite: true
    update_on_launch: true
    source_vars:
      private: false
    source: openstack
  register: result

- assert:
    that:
      - "result is changed"

- name: Create an source inventory with exists
  inventory_source:
    name: "{{ openstack_inv_source }}"
    description: Source for Test inventory
    inventory: "{{ openstack_inv }}"
    credential: "{{ credential_result.id }}"
    overwrite: true
    update_on_launch: true
    source_vars:
      private: false
    source: openstack
    state: exists
  register: result

- assert:
    that:
      - "result is not changed"

- name: Delete an source inventory
  inventory_source:
    name: "{{ openstack_inv_source }}"
    description: Source for Test inventory
    inventory: "{{ openstack_inv }}"
    credential: "{{ credential_result.id }}"
    overwrite: true
    update_on_launch: true
    source_vars:
      private: false
    source: openstack
    state: absent
  register: result

- assert:
    that:
      - "result is changed"

- name: Create an source inventory with exists
  inventory_source:
    name: "{{ openstack_inv_source }}"
    description: Source for Test inventory
    inventory: "{{ openstack_inv }}"
    credential: "{{ credential_result.id }}"
    overwrite: true
    update_on_launch: true
    source_vars:
      private: false
    source: openstack
    state: exists
  register: result

- assert:
    that:
      - "result is changed"

- name: Delete the inventory source with an invalid cred and source_project specified
  inventory_source:
    name: "{{ result.id }}"
    inventory: "{{ openstack_inv }}"
    credential: "Does Not Exit"
    source_project: "Does Not Exist"
    state: absent

- assert:
    that:
      - "result is changed"

- name: Create an instance group
  instance_group:
    name: "{{ ig_name }}"
    state: present

- name: Create an inventory source running on that instance group
  inventory_source:
    name: "{{ openstack_inv_source }}"
    inventory: "{{ openstack_inv }}"
    source: ec2
    instance_groups:
      - "{{ ig_name }}"
    state: present
  register: result

- assert:
    that:
      - "result is changed"

- name: Read back the instance groups of the source
  set_fact:
    source_igs: "{{ query('ctrliq.ascender.controller_api', 'inventory_sources/' + (result.id | string) + '/instance_groups') }}"

- assert:
    that:
      - source_igs | map(attribute='name') | list == [ig_name]

- name: Set the same instance group again
  inventory_source:
    name: "{{ openstack_inv_source }}"
    inventory: "{{ openstack_inv }}"
    source: ec2
    instance_groups:
      - "{{ ig_name }}"
    state: present
  register: result

- assert:
    that:
      - "result is not changed"

- name: Take the instance group away
  inventory_source:
    name: "{{ openstack_inv_source }}"
    inventory: "{{ openstack_inv }}"
    source: ec2
    instance_groups: []
    state: present
  register: result

- assert:
    that:
      - "result is changed"

- name: Read back the instance groups of the source
  set_fact:
    source_igs: "{{ query('ctrliq.ascender.controller_api', 'inventory_sources/' + (result.id | string) + '/instance_groups') }}"

- assert:
    that:
      - source_igs | length == 0

- name: Delete the inventory source
  inventory_source:
    name: "{{ openstack_inv_source }}"
    inventory: "{{ openstack_inv }}"
    state: absent

- name: Delete the instance group
  instance_group:
    name: "{{ ig_name }}"
    state: absent

- name: Delete the credential
  credential:
    description: Credentials for Openstack Test project
    name: "{{ openstack_cred }}"
    credential_type: OpenStack
    organization: Default
    inputs:
      project: Test
      username: admin
      host: https://example.org:5000
      password: passw0rd
      domain: test
    state: absent

- assert:
    that:
      - "result is changed"

- name: Delete the inventory
  inventory:
    description: Test inventory
    organization: Default
    name: "{{ openstack_inv }}"
    state: absent

- assert:
    that:
      - "result is changed"
