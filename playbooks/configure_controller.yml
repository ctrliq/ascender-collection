---
- name: Playbook to configure Ascender post installation
  hosts: localhost
  connection: local
  # Nothing here reads a fact. The roles talk to the controller API over the
  # network, so gathering costs a setup run on localhost for no reader.
  gather_facts: false
  tasks:
    - name: Include vars from configs directory
      ansible.builtin.include_vars:
        dir: "{{ controller_configs_dir | default((lookup('env', 'CONTROLLER_CONFIGS_DIR') == '') | ternary('./configs', lookup('env', 'CONTROLLER_CONFIGS_DIR')))
          }}"
        ignore_files: [controller_config.yml.template]
        extensions: [yml]
        # extensions alone is not a filter: include_vars fails on any file in the
        # directory that does not match, so a README.md beside the configs stops
        # the run before a single role is called.
        ignore_unknown_extensions: true
      tags:
        - always

    - name: Call dispatch role
      ansible.builtin.include_role:
        name: ctrliq.ascender.dispatch
...
