---
bugfixes:
  - The instance_group module clears ``credential`` by sending null instead of an empty string. The API
    returns an unset credential as null, so the empty string never compared equal, every run patched
    every group given an empty credential, and check mode reported them all as changed. The
    instance_groups role sends an empty credential to every group when it enforces defaults, so that
    was every group on every run.
  - The instance_groups role passes an empty ``credential`` through to the module instead of dropping it,
    so a container group can be taken off its credential without turning on enforce defaults.
