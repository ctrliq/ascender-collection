security_fixes:
  - filetree_create - every value the templates export is now written through the new
    ``ctrliq.ascender.export_yaml`` filter, which double-quotes strings and tags them ``!unsafe``.
    Before, a resource name, description or variable containing ``{{ }}`` was templated when
    ``filetree_read`` loaded the export, and one containing a double quote and a newline could
    add keys to the exported entry.
  - flatten_filetree_create_output playbook - write the flattened files through ``export_yaml``,
    so the ``!unsafe`` tags loaded from the export are kept.
bugfixes:
  - filetree_create - booleans and integers are exported as native YAML values instead of quoted
    strings, and strings keep their type, so ``yes``, ``no`` or ``on`` are no longer turned into
    booleans and ``1.10`` or ``1.2`` in ``extra_vars`` no longer become floats.
  - filetree_create - multi-line ``extra_vars`` values keep their newlines instead of a literal ``\n``.
  - filetree_create - a survey password default is exported as an empty string instead of the two
    characters ``''``, and an inventory ``host_filter`` is exported as the controller returns it.
minor_changes:
  - filetree_create - an instance ``capacity_adjustment`` is exported as the string the API returns
    (for example ``'1.00'``), which the instance module accepts for its float option.
  - filetree_create - a schedule's ``dtend`` and ``job_type`` are exported as null instead of an
    empty string when unset; the schedules role omits both either way.
