---
bugfixes:
  - dispatch role - Moved ``instance_groups`` after ``credential_types``, ``credentials`` and
    ``credential_input_sources`` in ``controller_configuration_dispatcher_roles``. A container group
    names the credential holding its Kubernetes or OpenShift connection, and the credential did not
    exist yet when the instance groups ran, so a full configuration run failed on the first pass and
    only worked on a second.
