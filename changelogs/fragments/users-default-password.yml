---
security_fixes:
  - users role - ``controller_user_default_password`` no longer defaults to the literal ``change_me``, which was sent for every
    entry in ``controller_user_accounts`` that did not set a password of its own. Because ``ctrliq.ascender.user`` defaults
    ``update_secrets`` to ``true``, it was also written over the password of accounts that already existed, including
    token-only accounts meant to have no usable password. The variable is now unset by default, so no password is sent.
breaking_changes:
  - users role - an entry in ``controller_user_accounts`` that creates a new account without a ``password`` no longer gets
    ``change_me``; the request reaches the API with no password, and the API decides whether to accept it. Declare
    ``password`` on new accounts, or set ``controller_user_default_password`` explicitly to keep the previous behavior.
