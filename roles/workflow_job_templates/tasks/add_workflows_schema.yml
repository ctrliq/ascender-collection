---
- name: add_workflows_schema | Manage Controller Workflow Nodes Block
  vars:
    ansible_async_dir: "{{ controller_configuration_async_dir }}"
  no_log: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
  block:
    # Creating Workflow Node
    - name: add_workflows_schema | Create the Workflow Nodes
      ctrliq.ascender.workflow_job_template_node:
        identifier: "{{ __workflow_loop_node_item.identifier | mandatory }}" # internal identification ID
        extra_data: "{{ __workflow_loop_node_item.extra_data | default(omit, true) }}"
        inventory: "{{ __workflow_loop_node_item.inventory | default(omit, true) }}"
        scm_branch: "{{ __workflow_loop_node_item.scm_branch | default(omit, true) }}"
        job_type: "{{ __workflow_loop_node_item.job_type | default(omit, true) }}"
        job_tags: "{{ __workflow_loop_node_item.job_tags | default(omit, true) }}"
        skip_tags: "{{ __workflow_loop_node_item.skip_tags | default(omit, true) }}"
        limit: "{{ __workflow_loop_node_item.limit | default(omit, true) }}"
        diff_mode: "{{ __workflow_loop_node_item.diff_mode | default(omit) }}"
        verbosity: "{{ __workflow_loop_node_item.verbosity | default(omit) }}"
        credentials: "{{ __workflow_loop_node_item.credentials | default(__workflow_loop_node_item.related.credentials | default([]) | map(attribute='name') | list) |
          default(omit, true) }}"
        workflow_job_template: "{{ __workflow_loop_node_item.workflow_job_template.name | default(__workflow_loop_node_item.workflow_job_template | default(omit, true))
          }}"
        unified_job_template: "{{ __workflow_loop_node_item.unified_job_template.name | default(__workflow_loop_node_item.unified_job_template | default(omit, true))
          }}" # Run Job template
        lookup_organization: "{{ __workflow_loop_node_item.lookup_organization | default(omit, true) }}"
        execution_environment: "{{ __workflow_loop_node_item.execution_environment.name | default(__workflow_loop_node_item.execution_environment | default(omit, true))
          }}"
        forks: "{{ __workflow_loop_node_item.forks | default(omit) }}"
        instance_groups: "{{ __workflow_loop_node_item.instance_groups | default(omit, true) }}"
        job_slice_count: "{{ __workflow_loop_node_item.job_slice_count | default(omit) }}"
        labels: "{{ __workflow_loop_node_item.labels | default(__workflow_loop_node_item.related.labels | default([]) | map(attribute='name') | list if __workflow_loop_node_item.related.labels
          is defined else omit) }}"
        timeout: "{{ __workflow_loop_node_item.timeout | default(omit) }}"
        approval_node: "{{ __workflow_loop_node_item.approval_node | default(omit, true) }}"
        workflow: "{{ __workflow_loop_item.name | mandatory }}" # Workflow job template name to associate with
        state: "{{ __workflow_loop_node_item.state | default(controller_state | default('present')) }}"
        all_parents_must_converge: "{{ __workflow_loop_node_item.all_parents_must_converge | default('false') }}"
        max_retries: "{{ __workflow_loop_node_item.max_retries | default(omit) }}"
        organization: "{{ __workflow_loop_item.organization.name | default(__workflow_loop_item.organization | default(omit)) }}" # organization

        # Role Standard Options
        controller_username: "{{ controller_username | default(omit, true) }}"
        controller_password: "{{ controller_password | default(omit, true) }}"
        controller_oauthtoken: "{{ controller_oauthtoken | default(omit, true) }}"
        request_timeout: "{{ controller_request_timeout | default(omit, true) }}"
        controller_host: "{{ controller_hostname | default(omit, true) }}"
        controller_config_file: "{{ controller_config_file | default(omit, true) }}"
        validate_certs: "{{ controller_validate_certs | default(omit) }}"
      loop: "{{ __workflow_loop_item.simplified_workflow_nodes | default([], true) }}"
      loop_control:
        loop_var: __workflow_loop_node_item
        label: "{{ __workflow_loop_item.name }}/{{ __workflow_loop_node_item.identifier }}"
        pause: "{{ controller_configuration_workflow_job_templates_loop_delay }}"
      when: "(__workflow_loop_item.state | default(controller_state | default('present'))) is match('present')"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __workflows_node_async
      no_log: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
      changed_when: (__workflows_node_async.changed if ansible_check_mode else false)

    - name: add_workflows_schema | Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __workflows_node_async.failed is defined and __workflows_node_async.failed

    - name: add_workflows_schema | Manage Workflow Nodes | Wait for finish the node creation
      when:
        - not ansible_check_mode
        - __workflows_node_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: ctrliq.ascender.collect_async_status
      loop: "{{ __workflows_node_async.results }}"
      loop_control:
        loop_var: __workflows_node_async_results_item
        label: "{{ __operation.verb }} Workflow node {{ __workflows_node_async_results_item.__workflow_loop_node_item.identifier }} | Wait for finish the node {{
          __operation.action }}"
      vars:
        __operation: "{{ operation_translate[__workflows_node_async_results_item.__workflow_loop_node_item.state | default(controller_state) | default('present')] }}"
        cas_secure_logging: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
        cas_async_delay: "{{ controller_configuration_workflow_job_templates_async_delay }}"
        cas_async_retries: "{{ controller_configuration_workflow_job_templates_async_retries }}"
        cas_job_async_results_item: "{{ __workflows_node_async_results_item }}"
        cas_error_list_var_name: "controller_workflows_errors"

    # Links are synced in two passes over every node. The first only takes out the links that are
    # no longer in the file, the second adds the new ones. Done node by node in a single pass, a
    # graph that changes direction trips the controller's cycle check, because the new link from
    # one node is refused while another node still holds the old link the other way round.
    - name: add_workflows_schema | Remove the links that are no longer in the file
      ansible.builtin.include_tasks: add_workflows_links.yml
      vars:
        __workflow_links_only_remove: true

    # A node that is on the controller but no longer in the file keeps its outgoing links and
    # has lost the incoming one, so it would run as soon as the workflow starts. It goes between
    # the two link passes: its old links could otherwise make a new link look like a cycle.
    - name: add_workflows_schema | Remove the Workflow Nodes that are not in simplified_workflow_nodes
      ctrliq.ascender.workflow_job_template_node:
        identifier: "{{ __workflow_prune_node_item }}"
        workflow: "{{ __workflow_loop_item.name | mandatory }}"
        organization: "{{ __workflow_loop_item.organization.name | default(__workflow_loop_item.organization | default(omit)) }}"
        state: absent
        controller_username: "{{ controller_username | default(omit, true) }}"
        controller_password: "{{ controller_password | default(omit, true) }}"
        controller_oauthtoken: "{{ controller_oauthtoken | default(omit, true) }}"
        request_timeout: "{{ controller_request_timeout | default(omit, true) }}"
        controller_host: "{{ controller_hostname | default(omit, true) }}"
        controller_config_file: "{{ controller_config_file | default(omit, true) }}"
        validate_certs: "{{ controller_validate_certs | default(omit) }}"
      loop: "{{ __workflow_current_node_identifiers | difference(__workflow_loop_item.simplified_workflow_nodes | map(attribute='identifier')) }}"
      loop_control:
        loop_var: __workflow_prune_node_item
        label: "{{ __workflow_loop_item.name }}/{{ __workflow_prune_node_item }}"
      when: __workflow_loop_item.prune_nodes | default(controller_configuration_workflow_job_templates_prune_nodes) | bool
      vars:
        __workflow_organization: "{{ __workflow_loop_item.organization.name | default(__workflow_loop_item.organization | default(none)) }}"
        __workflow_current_node_identifiers: "{{ query('ctrliq.ascender.controller_api', 'workflow_job_template_nodes',
          query_params={'workflow_job_template__name': __workflow_loop_item.name}
          | combine({'workflow_job_template__organization__name': __workflow_organization} if __workflow_organization else {}),
          return_all=true, max_objects=query_controller_api_max_objects | default(10000),
          host=controller_hostname | default(none), username=controller_username | default(none), password=controller_password | default(none),
          oauth_token=controller_oauthtoken | default(none), verify_ssl=controller_validate_certs | default(none),
          request_timeout=controller_request_timeout | default(none)) | map(attribute='identifier') | list }}"

    - name: add_workflows_schema | Create links between Workflow Nodes
      ansible.builtin.include_tasks: add_workflows_links.yml
      vars:
        __workflow_links_only_remove: false

  always:
    - name: add_workflows_schema | Cleanup async results files
      when:
        - not ansible_check_mode
        - __workflows_schema_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __workflows_schema_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __workflows_node_async.results | default([]) }}"
      loop_control:
        loop_var: __workflows_schema_results_item
        label: "Cleaning up job results file: {{ __workflows_schema_results_item.results_file | default('Unknown') }}"
...
