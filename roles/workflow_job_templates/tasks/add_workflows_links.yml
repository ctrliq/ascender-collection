---
# Included twice by add_workflows_schema.yml, see the comment there
- name: add_workflows_links | Manage Controller Workflow Links Block
  vars:
    ansible_async_dir: "{{ controller_configuration_async_dir }}"
  no_log: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
  block:
    - name: add_workflows_links | Sync the links between Workflow Nodes
      ctrliq.ascender.workflow_job_template_node:
        identifier: "{{ __workflow_loop_node_item.identifier | mandatory }}"
        workflow: "{{ __workflow_loop_item.name | mandatory }}"
        always_nodes: "{{ __workflow_loop_node_item.always_nodes | default(__workflow_loop_node_item.related.always_nodes | default([], true) | selectattr('identifier',
          'defined') | map(attribute='identifier')) | list }}" # Nodes to advance on always (blue links)
        success_nodes: "{{ __workflow_loop_node_item.success_nodes | default(__workflow_loop_node_item.related.success_nodes | default([], true) | selectattr('identifier',
          'defined') | map(attribute='identifier')) | list }}" # Nodes to advance on success (green links)
        failure_nodes: "{{ __workflow_loop_node_item.failure_nodes | default(__workflow_loop_node_item.related.failure_nodes | default([], true) | selectattr('identifier',
          'defined') | map(attribute='identifier')) | list }}" # Nodes to advance on failure (red links)
        only_remove_links: "{{ __workflow_links_only_remove }}"
        condition_nodes: "{{ __workflow_loop_node_item.condition_nodes | default(__workflow_loop_node_item.related.condition_nodes | default([], true))
          | list }}" # Nodes to advance when an upstream artifact matches a condition
        state: "{{ __workflow_loop_node_item.state | default(controller_state | default('present')) }}"
        organization: "{{ __workflow_loop_item.organization.name | default(__workflow_loop_item.organization | default(omit)) }}" # organization
        controller_username: "{{ controller_username | default(omit, true) }}"
        controller_password: "{{ controller_password | default(omit, true) }}"
        controller_oauthtoken: "{{ controller_oauthtoken | default(omit, true) }}"
        request_timeout: "{{ controller_request_timeout | default(omit, true) }}"
        controller_host: "{{ controller_hostname | default(omit, true) }}"
        controller_config_file: "{{ controller_config_file | default(omit, true) }}"
        validate_certs: "{{ controller_validate_certs | default(omit) }}"
      loop: "{{ __workflow_loop_item.simplified_workflow_nodes | default([], true) }}"
      loop_control:
        loop_var: __workflow_loop_node_item
        label: "{{ __workflow_loop_node_item.identifier }}"
      no_log: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
      # Every node is synced, including the ones that declare no links, since that is how a
      # link that was taken out of the file gets removed from the controller
      when: (__workflow_loop_node_item.state | default(controller_state | default('present'))) != 'absent'
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __workflows_link_async

    - name: add_workflows_links | Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __workflows_link_async.failed is defined and __workflows_link_async.failed

    - name: add_workflows_links | Manage Workflow Links | Wait for finish the link creation
      when:
        - not ansible_check_mode
        - __workflows_link_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: ctrliq.ascender.collect_async_status
      loop: "{{ __workflows_link_async.results }}"
      loop_control:
        loop_var: __workflows_link_async_results_item
        label: "{{ __operation.verb }} Workflow links for {{ __workflows_link_async_results_item.__workflow_loop_node_item.identifier }} | Wait for finish the link {{
          __operation.action }}"
      vars:
        __operation: "{{ operation_translate[__workflows_link_async_results_item.__workflow_loop_node_item.state | default(controller_state) | default('present')] }}"
        cas_secure_logging: "{{ controller_configuration_workflow_job_templates_secure_logging }}"
        cas_async_delay: "{{ controller_configuration_workflow_job_templates_async_delay }}"
        cas_async_retries: "{{ controller_configuration_workflow_job_templates_async_retries }}"
        cas_job_async_results_item: "{{ __workflows_link_async_results_item }}"
        cas_error_list_var_name: "controller_workflows_errors"

  always:
    - name: add_workflows_links | Cleanup async results files
      when:
        - not ansible_check_mode
        - __workflows_link_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __workflows_link_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __workflows_link_async.results | default([]) }}"
      loop_control:
        loop_var: __workflows_link_results_item
        label: "Cleaning up job results file: {{ __workflows_link_results_item.results_file | default('Unknown') }}"
...
