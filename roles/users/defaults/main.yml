---
# list of dicts describing Controller users
controller_user_accounts: []
# Password for any entry in controller_user_accounts that does not set one of its own.
# Unset by default: a shipped literal would be the same password on every installation, and
# ctrliq.ascender.user defaults update_secrets to true, so a value set here is re-applied to
# accounts that already exist on every run.
# controller_user_default_password:

controller_configuration_users_secure_logging: "{{ controller_configuration_secure_logging | default('true') }}"
controller_configuration_users_async_retries: "{{ controller_configuration_async_retries | default(50) }}"
controller_configuration_users_async_delay: "{{ controller_configuration_async_delay | default(1) }}"
controller_configuration_users_loop_delay: "{{ controller_configuration_loop_delay | default(0) }}"
controller_configuration_async_dir:
controller_configuration_users_enforce_defaults: "{{ controller_configuration_enforce_defaults | default(false) }}"
...
