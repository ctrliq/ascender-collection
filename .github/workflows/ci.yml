---
name: Ascender Collection CI

on:
  push:
    branches:
      - main
      - stable-*
  pull_request:
    branches:
      - main
      - stable-*
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  sanity:
    name: Sanity (Ansible ${{ matrix.ansible }} / Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ansible-core 2.16 (minimum in meta/runtime.yml) — Python 3.10-3.12
          - ansible: stable-2.16
            python: "3.10"
          - ansible: stable-2.16
            python: "3.12"
          # ansible-core 2.17 — Python 3.10-3.12
          - ansible: stable-2.17
            python: "3.10"
          - ansible: stable-2.17
            python: "3.12"
          # ansible-core 2.18 — Python 3.11-3.13
          - ansible: stable-2.18
            python: "3.12"
          # ansible-core 2.19 — Python 3.11-3.13
          - ansible: stable-2.19
            python: "3.12"
          - ansible: stable-2.19
            python: "3.13"
          # ansible-core 2.20 — Python 3.11-3.13
          - ansible: stable-2.20
            python: "3.12"
          # ansible-core 2.21 — Python 3.12-3.13
          - ansible: stable-2.21
            python: "3.13"
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          target-python-version: ${{ matrix.python }}
          testing-type: sanity

  build:
    name: Build & Galaxy import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build --force

      - name: Verify artifact exists
        run: ls -la ctrliq-ascender-*.tar.gz

      - name: Install galaxy-importer
        run: pip install galaxy-importer

      - name: Validate with galaxy-importer
        run: python -m galaxy_importer.main ctrliq-ascender-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: collection-artifact
          path: ctrliq-ascender-*.tar.gz
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible-core ruff yamllint ansible-lint

      - name: ruff — plugins
        run: ruff check plugins/

      - name: yamllint — meta and galaxy
        run: yamllint meta/ galaxy.yml

      - name: ansible-lint
        run: ansible-lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    # settings_for_test in the ascender checkout points DATABASES at PostgreSQL on
    # 127.0.0.1:5432. It ran on SQLite until ctrliq/ascender 2c0160da71, which needed
    # no service, so this job never had one and every test that opens a connection
    # errors out. The values below are the names settings_for_test falls back to when
    # no AWX_TEST_DATABASE_* is set, which is why the test step needs no extra env.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: awx
          POSTGRES_PASSWORD: awxpass
          POSTGRES_DB: awx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout ascender (for Django models)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ctrliq/ascender
          persist-credentials: false
          path: ascender

      # ascender moved its images to Python 3.14 and its requirements to Django 6.1.1.
      # On 3.12 the django-guid marker still caps Django below 6.0 and the install
      # cannot resolve, so this job needs 3.13 or newer.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            tests/unit/requirements.txt
            ascender/requirements/requirements.txt
            ascender/requirements/requirements_git.txt
            ascender/requirements/requirements_dev.txt

      # The runner image carries third party apt sources, Google Chrome and Microsoft,
      # that none of the packages below come from. A transient hash sum mismatch on one
      # of them makes apt-get update exit 100 and fails this step, which is worse than it
      # sounds: the job dies before pytest runs, so the unit results are missing rather
      # than red, and a genuinely broken test reads as an infrastructure blip. That is how
      # the _COLLECTION_VERSION mismatch fixed in #304 reached main unnoticed.
      #
      # Keep ubuntu.sources, which is where these packages actually live, and drop the
      # rest, so only an Ubuntu archive failure can fail the step. The Ubuntu sources moved
      # into sources.list.d in deb822 format on noble, so this prunes by name rather than
      # by directory, and skips the prune entirely if that file ever moves again: losing
      # the hardening is better than deleting every source and failing the build.
      - name: Install system build dependencies
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo find /etc/apt/sources.list.d -type f ! -name ubuntu.sources -delete
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev \
            libsasl2-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            pkg-config

      - name: Install dependencies
        run: |
          pip install ansible-core
          pip install -r tests/unit/requirements.txt
          pip install -r ascender/requirements/requirements.txt
          pip install -r ascender/requirements/requirements_git.txt
          pip install -r ascender/requirements/requirements_dev.txt
          pip install -e ascender
          pip install ascender-kit

      - name: Run unit tests
        env:
          DJANGO_SETTINGS_MODULE: awx.main.tests.settings_for_test
        run: |
          sudo install -d -o "$USER" -g "$USER" -m 0755 /var/log/tower
          pytest tests/unit/ -v --nomigrations --reuse-db

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install antsibull-changelog
        run: pip install antsibull-changelog

      - name: Lint changelog
        run: antsibull-changelog lint
